name: gpu

# Forward-looking GPU track workflow.
#
# Today this is a no-op slot: cham-gpu's `metal` feature is macOS-only and
# CI runs on ubuntu-latest, so the feature-gated tests just print SKIP. It
# exists so that when Amendment 002's wgpu port lands (G5.0), the
# correctness gate (P7) runs automatically on Linux against llvmpipe
# (software Vulkan) with no workflow churn.
#
# Per docs/GPU-PLAN-AMENDMENTS.md:
#   - Correctness (P7) runs here on Linux.
#   - Throughput gates (G_enum, G_warm) run only on a GPU-equipped runner
#     or an explicitly quiet local session — never on this job.

on:
  workflow_dispatch:
    inputs:
      run_gpu_bench:
        description: "Also run the GPU bench on macos-14 (expensive: 10x Linux minutes)"
        type: boolean
        default: false
  push:
    branches: [main, "gpu/**"]
    paths:
      - "crates/cham-gpu/**"
      - "crates/cham-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/gpu.yml"
      - "docs/GPU-PLAN-AMENDMENTS.md"
  pull_request:
    branches: [main]
    paths:
      - "crates/cham-gpu/**"
      - "crates/cham-core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - ".github/workflows/gpu.yml"

permissions:
  contents: read

concurrency:
  group: gpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
# Override the workspace `.cargo/config.toml`'s `target-cpu=native` with a
# portable x86_64 feature level. The local dev machine sets `native` (fine
# there); on GitHub Actions runners `native` resolves to whatever the
# transient host supports and has produced SIGILL crashes when the runner
# VM lacked a feature the compiler had enabled. Matches bench.yml.
RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  correctness:
    name: cham-gpu correctness (ubuntu-latest, feature-off)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu-correctness

      - uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy -p cham-gpu --all-targets -- -D warnings

      # Feature-off path: the consistency test prints SKIP and returns Ok.
      # On Linux with `--features metal`, the same test still SKIPs — the
      # metal crate is gated on `target_os = "macos"`. Both builds are
      # exercised to catch accidental cfg breakage.
      - name: tests (default features)
        run: cargo nextest run -p cham-gpu --no-fail-fast

      - name: build with metal feature (Linux gate check)
        run: cargo check -p cham-gpu --all-targets --features metal || true
        continue-on-error: true

      - name: tests (feature-off, cham-cli smoke)
        run: cargo nextest run -p cham-cli --no-fail-fast

      - name: gpu-doctor smoke
        run: cargo run -q -p cham-cli -- gpu-doctor

      # P7 correctness gate on Linux/Vulkan. Uses Mesa's llvmpipe software
      # rasterizer, so no hardware GPU is required. Slow (minutes for 1M
      # hands) but this is the cross-platform correctness guarantee that
      # Amendment 002 promised — same corpus, same seed, same bit-exact
      # assertion as the macOS-Metal path.
      - name: install llvmpipe (mesa-vulkan-drivers)
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers

      - name: wgpu correctness (llvmpipe)
        run: |
          cargo nextest run -p cham-gpu --features wgpu --test consistency_eval7 \
            --no-fail-fast --nocapture

  gpu-bench-macos:
    # Manual only — macOS runners cost 10x Linux minutes. This job is the
    # stable-bench slot the amendment calls for: a quiet, un-contended
    # Apple Silicon runner on which the amended gates (G_enum >= 3x,
    # G_warm >= 2x) can be certified. See docs/GPU-PLAN-AMENDMENTS.md
    # Amendment 001.
    name: GPU bench (macos-14, Apple Silicon, manual)
    if: github.event_name == 'workflow_dispatch' && inputs.run_gpu_bench
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gpu-bench-macos

      - name: show device
        run: system_profiler SPDisplaysDataType | head -20

      - name: gpu-probe verdict
        run: |
          cargo run -q --release -p cham-gpu --features metal --bin gpu-probe -- \
            --mode verdict --hands 1000000 --boards 10000 --reps 20 \
            | tee /tmp/gpu-verdict.log

      - name: upload verdict log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-verdict-${{ github.run_id }}
          path: /tmp/gpu-verdict.log
          retention-days: 90
