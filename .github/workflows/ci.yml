name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Override the workspace `.cargo/config.toml`'s `target-cpu=native` with a
  # portable x86_64 feature level. The local dev machine sets `native` (fine
  # there); on GitHub Actions runners `native` resolves to whatever the
  # transient host supports and has produced SIGILL crashes when the runner
  # VM lacked a feature the compiler had enabled. Matches bench.yml.
  RUSTFLAGS: "-C target-cpu=x86-64-v3"

jobs:
  test:
    name: fmt / clippy / nextest (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@nextest

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo nextest run --workspace --no-fail-fast
