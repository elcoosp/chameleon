[package]
name = "cham-gpu"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Feature-gated Apple Metal accelerator (whitelist amendment per docs/GPU-PLAN.md)"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
cham-core = { path = "../cham-core" }
metal = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

[features]
default = []
metal = ["dep:metal"]
wgpu = ["dep:wgpu", "dep:pollster"]

[dev-dependencies]
tempfile = { workspace = true }

# Per-crate lint override (docs/GPU-PLAN.md Part II + worklog G0.2b):
# the workspace sets `unsafe_code = "forbid"`, but the Metal FFI shim in
# src/mtl.rs needs ONE scoped `#[allow(unsafe_code)]` for a from_raw_parts
# cast (metal 0.31's buffer / set_bytes APIs are safe; only `contents()`
# returns a raw pointer). Forbid cannot be relaxed; deny can. All other
# workspace lints are mirrored verbatim so nothing else changes.
[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "allow"

[lints.clippy]
needless_range_loop = "allow"
too_many_arguments = "allow"
module_inception = "allow"
