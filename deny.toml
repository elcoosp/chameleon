# cargo-deny configuration — enforces the closed dependency whitelist (SPECS/00 §2).
[graph]
all-features = false

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause",
  "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "CDLA-Permissive-2.0",
]
# The AGPL dev-time oracle (`postflop-solver`, SPECS/06 §5.3) is NEVER a workspace
# dependency — it is documented as an offline procedure only. If it ever appears
# here, this deny file is the tripwire:
deny = ["AGPL-3.0"]

[bans]
multiple-versions = "warn"
deny = [
  # forbidden families (SPECS/00 §2)
  { crate = "nalgebra", reason = "whitelist" },
  { crate = "ndarray", reason = "whitelist" },
  { crate = "linfa", reason = "whitelist" },
  { crate = "tch", reason = "whitelist" },
  { crate = "burn", reason = "whitelist" },
  { crate = "candle-core", reason = "whitelist (v2 stretch only)" },
  { crate = "tokio", reason = "no async in the workspace" },
  { crate = "rusqlite", reason = "no sqlite; cham-rec owns JSONL" },
  { crate = "polars", reason = "whitelist" },
]

[advisories]
version = 2
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
