# SPECS/08 §3 / SPECS/10 §3 — per-opponent duplicate-pair σ (bb/deal), measured in the
# M1 pilot and committed here. The values below are M1-pilot ESTIMATES for the tiny
# abstraction; re-measure and re-commit at M2 (they must never be borrowed cross-opponent).
# `family` follows SPECS/03 §5: A = in-family scripts, B/PN/noise = out-of-family.
[[opponents]]
id = "arch:nit"
family = "A"
sigma_pair = 3.5

[[opponents]]
id = "arch:tag"
family = "A"
sigma_pair = 3.5

[[opponents]]
id = "arch:lag"
family = "A"
sigma_pair = 3.5

[[opponents]]
id = "arch:station"
family = "A"
sigma_pair = 3.5

[[opponents]]
id = "callbot"
family = "A"
sigma_pair = 3.0

[[opponents]]
id = "jamfix"
family = "A"
sigma_pair = 4.0

[[opponents]]
id = "pnash:overfold:0.15"
family = "PN"
sigma_pair = 3.5

[[opponents]]
id = "famB:tag"
family = "B"
sigma_pair = 3.5

[[opponents]]
id = "noisy:0.1:arch:lag@0"
family = "noise"
sigma_pair = 3.5

# SPRT defaults for screening arms (SPECS/10 §3)
[sprt]
delta0_mb = 0.0
delta1_mb = 25.0
alpha = 0.05
beta = 0.10
