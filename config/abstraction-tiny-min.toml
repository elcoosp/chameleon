# Minimal abstraction for testing the "abstraction too fine for iteration
# budget" hypothesis (2026-09-28).
#
# tiny has 32 flop / 16 turn / 16 river = ~21k infosets after training. At
# 500k iters that's ~24 visits/infoset — under-trained. This config roughly
# quarters the bucket count (8/8/8) so the same iteration budget yields
# ~4x more visits per infoset at the cost of a coarser state space.
#
# If this variant measures BETTER LBR than tiny at the same iteration
# budget, then the tiny abstraction is iteration-starved and the fix is
# a coarser bucket set (or a faster trainer), not a richer betting tree.
version = 2

spr_bands = [
  0.3, 0.37104, 0.45874, 0.56723, 0.70122, 0.86668, 1.07134, 1.32414,
  1.63654, 2.02247, 2.49981, 3.08914, 3.81757, 4.71752, 5.82902, 7.20363,
  40.0,
]
seq_history_len = 8

[buckets]
preflop = "exact169"
flop_k = 8
turn_k = 8
river_eq_bins = 8
river_texture_classes = 2

[ladder]
preflop_open_bb = [2.5]
raise_fracs = [1.0]
flop_bet_fracs = [0.5]
turn_bet_fracs = [0.5]
river_bet_fracs = [0.5, 1.25]
raises_per_street_cap = 1
all_in_always = true
