# W2: abstraction version 3. Same bucket fineness as real-full, plus the
# v3 key split (C-3: bucket mixed into the public-part hash, not inline)
# and imperfect-recall history compression.
#
# The v3 fields (`slot_bucket`, `compress_history`) are config-sourced
# rather than env-sourced. Hashing them into `abstraction_hash` means a
# v3 bundle's keys are stable regardless of the CHAM_* env flags that
# corrupted the v2 bundles this session.
#
# NOTE: enabling `compress_history` CHANGES KEYS. A bundle trained at v3
# with it on is not queryable without the same config. This file has it
# ON; a no-compression variant is abstraction-v3-nocompress.toml.
version = 3
spr_bands = [0.3, 0.37104, 0.45874, 0.56723, 0.70122, 0.86668, 1.07134, 1.32414, 1.63654, 2.02247, 2.49981, 3.08914, 3.81757, 4.71752, 5.82902, 7.20363, 40.0]
seq_history_len = 8
compress_history = true

[buckets]
preflop = "exact169"
flop_k = 128
turn_k = 64
river_eq_bins = 64
river_texture_classes = 8

[ladder]
preflop_open_bb = [2.5]
preflop_levels_bb = [[2.5], [8.0], [20.0]]
raise_fracs = [1.0]
flop_bet_fracs = [0.5]
turn_bet_fracs = [0.5]
river_bet_fracs = [0.5, 1.25]
raises_per_street_cap = 1
all_in_always = true
slot_bucket = true
