# M1 "walking skeleton" abstraction (SPECS/11 M1). The committed artifacts under
# artifacts/buckets-tiny/ are built from THIS file; `ladder --fast`, tests and the
# first training runs use it. The full build above is the M2 step.
version = 2

[buckets]
preflop = "exact169"
flop_k = 32
turn_k = 16
river_eq_bins = 16
river_texture_classes = 4

[ladder]
preflop_open_bb = [2.5]
raise_fracs = [1.0]
flop_bet_fracs = [0.5]
turn_bet_fracs = [0.5]
river_bet_fracs = [0.5, 1.25]
raises_per_street_cap = 1
all_in_always = true

spr_bands = [
  0.3, 0.37104, 0.45874, 0.56723, 0.70122, 0.86668, 1.07134, 1.32414,
  1.63654, 2.02247, 2.49981, 3.08914, 3.81757, 4.71752, 5.82902, 7.20363,
  40.0,
]
seq_history_len = 8
