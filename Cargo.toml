[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://internal.invalid/chameleon"

[workspace.dependencies]
# ——— closed dependency whitelist (SPECS/00 §2) ———
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
zstd = "0.13"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
anyhow = "1"
rayon = "1"
ureq = { version = "2", features = ["json"] }
rustc-hash = "1.1"
memmap2 = "0.9" # SPECS/00 pins 0.6; 0.9 is the maintained line with an identical safe API for our use (decision D-001)
bytemuck = "1"
arrayvec = "0.7"
blake3 = "1"
# dev-only
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
insta = "1"
tempfile = "3"

[profile.dev]
opt-level = 3 # tests run the real algorithms; debug builds must not be glacial (SPECS/00 §1)

[profile.test]
opt-level = 1 # fast dev loop (B10.3); numerics-critical crates keep O3 below

# Integer fixed-point tests are level-insensitive; the crates below run the
# real algorithms and stay at opt-level 3 so numeric gates are unaffected.
[profile.test.package.cham-core]
opt-level = 3
[profile.test.package.cham-blueprint]
opt-level = 3
[profile.test.package.cham-engine]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "allow"

[workspace.lints.clippy]
needless_range_loop = "allow" # hot numeric loops read better indexed; benches prove no cost
too_many_arguments = "allow"  # some API surfaces are wide by contract
module_inception = "allow"
